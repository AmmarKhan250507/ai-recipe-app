<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Recipe Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-gradient: linear-gradient(135deg, rgba(102,126,234,0.85) 0%, rgba(118,75,162,0.85) 100%);
      --card-bg: #ffffff;
      --text-main: #2d2d2d;
      --text-sub: #888888;
      --drop-bg: #fafaff;
      --drop-border: #c9c9f5;
      --drop-hover-bg: #f3f0ff;
      --drop-hover-border: #764ba2;
      --result-bg: #f8f7ff;
      --result-border: #ece9fb;
      --result-text: #333333;
    }

    body.dark {
      --bg-gradient: linear-gradient(135deg, rgba(31,28,44,0.9) 0%, rgba(48,43,78,0.9) 100%);
      --card-bg: #262233;
      --text-main: #f0eef8;
      --text-sub: #a8a3bd;
      --drop-bg: #1e1a2c;
      --drop-border: #4a4368;
      --drop-hover-bg: #2c2645;
      --drop-hover-border: #9d8fd6;
      --result-bg: #1e1a2c;
      --result-border: #3a3355;
      --result-text: #e6e2f5;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: var(--bg-gradient), url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
      animation: fadeIn 0.5s ease;
      position: relative;
      transition: background 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: 1px solid var(--drop-border);
      border-radius: 50px;
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-sub);
      box-shadow: none;
      margin: 0;
    }

    .theme-toggle:hover {
      transform: none;
      box-shadow: none;
      background: var(--drop-bg);
    }

    .emoji-badge { font-size: 44px; margin-bottom: 8px; }

    h1 {
      font-size: clamp(22px, 5vw, 28px);
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .subtitle { color: var(--text-sub); font-size: 14px; margin-bottom: 24px; }

    .drop-zone {
      border: 2px dashed var(--drop-border);
      border-radius: 14px;
      padding: 28px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      background: var(--drop-bg);
      display: block;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--drop-hover-border);
      background: var(--drop-hover-bg);
      transform: scale(1.01);
    }

    .drop-zone p { color: var(--text-sub); font-size: 14px; margin-top: 8px; }
    .drop-zone .icon { font-size: 32px; }

    #photoInput { display: none; }

    #preview {
      display: none;
      margin-top: 16px;
    }

    button#generateBtn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 14px 0;
      width: 100%;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 16px rgba(118,75,162,0.35);
    }

    button#generateBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(118,75,162,0.45);
    }

    button#generateBtn:disabled {
      background: #999;
      cursor: not-allowed;
      box-shadow: none;
    }

    #loading {
      display: none;
      margin-top: 18px;
      color: #9d8fd6;
      font-weight: 600;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e0d9f5;
      border-top-color: #764ba2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #result {
      text-align: left;
      background: var(--result-bg);
      border: 1px solid var(--result-border);
      padding: 20px;
      border-radius: 14px;
      margin-top: 20px;
      white-space: pre-wrap;
      display: none;
      line-height: 1.6;
      font-size: 14.5px;
      color: var(--result-text);
      animation: fadeIn 0.4s ease;
    }

    @media (max-width: 400px) {
      .card { padding: 24px 18px; }
      body { background-attachment: scroll; }
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    <div class="emoji-badge">🍳</div>
    <h1>AI Recipe Generator</h1>
    <p class="subtitle">Upload photos of your ingredients, get a recipe instantly</p>

    <label class="drop-zone" id="dropZone">
      <div class="icon">📷</div>
      <p id="dropText">Tap to upload or drag photo(s) here</p>
      <input type="file" id="photoInput" accept="image/*" multiple />
    </label>

    <div id="preview"></div>

    <button id="generateBtn">✨ Get Recipe</button>

    <div id="loading"><span class="spinner"></span>AI is looking at your photos...</div>
    <div id="result"></div>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const dropZone = document.getElementById('dropZone');
    const dropText = document.getElementById('dropText');
    const preview = document.getElementById('preview');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(isDark) {
      document.body.classList.toggle('dark', isDark);
      themeToggle.textContent = isDark ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem('recipeAppDark', isDark ? '1' : '0');
    }
    applyTheme(localStorage.getItem('recipeAppDark') === '1');
    themeToggle.addEventListener('click', () => {
      applyTheme(!document.body.classList.contains('dark'));
    });

    function showPreview(files) {
      if (!files || files.length === 0) return;
      preview.innerHTML = '';
      preview.style.display = 'flex';
      preview.style.gap = '8px';
      preview.style.flexWrap = 'wrap';
      preview.style.justifyContent = 'center';
      Array.from(files).forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.style.maxHeight = '100px';
        img.style.borderRadius = '10px';
        img.style.boxShadow = '0 4px 10px rgba(0,0,0,0.15)';
        preview.appendChild(img);
      });
      dropText.textContent = files.length + ' photo(s) selected';
      result.style.display = 'none';
    }

    photoInput.addEventListener('change', () => showPreview(photoInput.files));

    ['dragover', 'dragenter'].forEach(evt =>
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      })
    );
    ['dragleave', 'drop'].forEach(evt =>
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      })
    );
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length > 0) {
        photoInput.files = e.dataTransfer.files;
        showPreview(e.dataTransfer.files);
      }
    });

    generateBtn.addEventListener('click', async () => {
      const files = photoInput.files;
      if (!files || files.length === 0) {
        alert('Please choose at least one photo!');
        return;
      }

      const formData = new FormData();
      Array.from(files).forEach(file => formData.append('photos', file));

      generateBtn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';

      try {
        const response = await fetch('/generate-recipe', {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();

        if (data.recipe) {
          result.textContent = data.recipe;
          result.style.display = 'block';
        } else {
          result.textContent = 'Error: ' + (data.error || 'Something went wrong');
          result.style.display = 'block';
        }
      } catch (err) {
        result.textContent = 'Error connecting to server: ' + err.message;
        result.style.display = 'block';
      } finally {
        generateBtn.disabled = false;
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
